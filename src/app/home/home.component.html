<div class="glass-dashboard">
  <header class="dash-header">
    <h1>Vision Board</h1>
    <p>Proyecta tu vida, enfoca tus metas y haz que suceda.</p>
  </header>

  <section class="action-section">
    <div class="input-glass">
      <input type="text" [(ngModel)]="nuevaMetaTexto" (keyup.enter)="agregarMeta()" placeholder="Añade un nuevo propósito..." class="premium-input" autocomplete="off">
      <button (click)="agregarMeta()" class="btn-luxe">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </button>
    </div>
  </section>

  <section class="goals-container">
    <div class="goals-stats"><span>En Progreso ({{ metasActivas.length }})</span></div>
    <div class="goals-grid">
      <div *ngFor="let item of metasActivas" class="goal-card">
        <div class="goal-info" *ngIf="metaEnEdicion !== item.id">
          <h3>{{ item.meta }}</h3>
          <span class="date">{{ item.fecha | date:'dd MMM yyyy, HH:mm' }}</span>
        </div>
        <div class="goal-edit" *ngIf="metaEnEdicion === item.id">
          <input type="text" [(ngModel)]="textoEdicion" (keyup.enter)="guardarEdicion(item)" class="premium-input edit-input">
          <div class="goal-actions force-show">
            <button (click)="guardarEdicion(item)" class="btn-icon btn-save"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg></button>
            <button (click)="cancelarEdicion()" class="btn-icon btn-cancel"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
          </div>
        </div>
        <div class="goal-actions" *ngIf="metaEnEdicion !== item.id">
          <button (click)="iniciarEdicion(item)" class="btn-icon btn-edit"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg></button>
          <button (click)="completarMeta(item)" class="btn-icon btn-check"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg></button>
        </div>
      </div>
    </div>
  </section>

  <section class="goals-container mt-5" *ngIf="metasCompletadas.length > 0">
    <div class="goals-stats"><span>Historial de Logros ({{ metasCompletadas.length }})</span></div>
    <div class="goals-grid">
      <div *ngFor="let item of metasCompletadas" class="goal-card completed-card">
        <div class="goal-info"><h3 class="strikethrough">{{ item.meta }}</h3></div>
        <div class="goal-actions force-show-hover">
          <button (click)="restaurarMeta(item)" class="btn-icon btn-restore"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"></polyline><polyline points="23 20 23 14 17 14"></polyline><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path></svg></button>
          <button (click)="eliminarDefinitivo(item.id)" class="btn-icon btn-delete"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg></button>
        </div>
      </div>
    </div>
  </section>
</div>
