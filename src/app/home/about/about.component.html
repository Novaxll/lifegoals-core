<div class="about-container">
  <div class="credencial-card">
    <div class="header"><h2>IDENTIFICACIÓN</h2></div>
    <div class="content">
      <p><strong>NOMBRE:</strong> {{ user.nombre }}</p>
      <p><strong>EDAD:</strong> {{ user.edad }}</p>
      <p><strong>ESTUDIOS:</strong> {{ user.estudio }}</p>
      <p><strong>RESIDENCIA:</strong> {{ user.ubicacion }}</p>
      <div class="tags">
        <span *ngFor="let tech of user.intereses">{{ tech }}</span>
      </div>
    </div>
  </div>
</div>
